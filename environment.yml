name: galea
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - libblas=*=*openblas   # MKL crashes (0xc06d007f) when the kernel starts without conda activation
  - pandas
  - scipy
  - plotly>=5.24
  - ipywidgets>=8
  - ipykernel
  - nbformat
  - nbclient
  - nbstripout         # strips notebook outputs on commit (run "nbstripout --install" once per clone)
  - jinja2
  - anywidget
  - pip
  - pip:
      - kaleido          # static figure export (uses the installed Chrome)
      - -e .             # the galea package, importable from any folder
