[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "galea_explorer"
version = "0.1.0"
description = "Load, quality-check and browse Galea / OpenBCI GUI recordings"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Diego A. Laplagne"}]
dependencies = [
    "numpy", "pandas", "scipy", "plotly>=5.24", "ipywidgets>=8", "anywidget", "nbformat", "jinja2", "kaleido",
]

[project.urls]
Repository = "https://github.com/LaRataLab/galea_explorer"

[tool.setuptools]
packages = ["galea", "galea.derived"]
